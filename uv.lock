]
testing = [
    { name = "chardet" },
    { name = "coverage", extra = ["toml"] },
    { name = "diff-cover" },
    { name = "moto", extra = ["ssm"] },
    { name = "pytest" },
    { name = "pytest-examples" },
    { name = "pytest-mock" },
    { name = "pytest-pretty" },
]

